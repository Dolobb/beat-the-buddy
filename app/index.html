<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffcf1f">
  <title>Бей друга</title>
  <style>
    @font-face{font-family:'Dela Gothic One';font-weight:400;font-display:swap;src:url(./vendor/fonts/DelaGothicOne-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:'Dela Gothic One';font-weight:400;font-display:swap;src:url(./vendor/fonts/DelaGothicOne-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'Golos Text';font-weight:500 800;font-display:swap;src:url(./vendor/fonts/GolosText-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:'Golos Text';font-weight:500 800;font-display:swap;src:url(./vendor/fonts/GolosText-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    :root{color-scheme:light;--ink:#21140f;--paper:#fff6e0;--yolk:#ffcf1f;--blood:#ff4530;--mint:#2fd39c;--wall:#f0705f;--r:14px;
      --top:calc(max(env(safe-area-inset-top),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 10px);
      --bottom:calc(max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px)) + 10px);
      --display:'Dela Gothic One','Golos Text',system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
      font-family:'Golos Text',system-ui,sans-serif;font-weight:600;color:var(--ink);background:var(--ink)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}button:disabled{cursor:default}
    ::selection{background:var(--yolk);color:var(--ink)}[hidden]{display:none!important}h1,h2,h3,p,ol{margin:0;padding:0}svg{display:block}
    #game{position:relative;width:100%;height:100dvh;min-height:360px;overflow:hidden;background:var(--wall)}
    canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

    /* Плашка бойца: портрет, имя, полоса здоровья как в файтинге */
    #hud{position:absolute;left:12px;top:var(--top);z-index:2;display:flex;align-items:center;gap:8px;pointer-events:none}
    #portrait{width:56px;height:56px;border-radius:50%;background:var(--yolk);border:3px solid var(--ink);overflow:hidden;flex:none;display:grid;place-items:end center}
    #portrait img{width:54px;height:auto;margin-bottom:-14px}
    #portrait.hit{animation:rattle .28s}
    .plate{display:grid;gap:3px}
    #friend-name{font:400 19px/1 var(--display);color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;padding-left:3px}
    #health{position:relative;width:min(44vw,190px);height:18px;background:var(--ink);border:3px solid var(--ink);border-radius:6px;transform:skewX(-14deg);overflow:hidden}
    #hp-ghost,#hp-fill{position:absolute;inset:0;transform-origin:left;border-radius:2px}
    #hp-ghost{background:var(--paper);transition:transform .5s .22s var(--ease)}
    #hp-fill{background:var(--mint);transition:transform .09s linear}
    #hp-label{position:absolute;inset:0;display:grid;place-items:center;font:400 10px/1 var(--display);color:var(--ink);transform:skewX(14deg);mix-blend-mode:normal}

    #coins{position:absolute;right:12px;top:var(--top);z-index:2;display:flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 6px;background:var(--ink);color:var(--yolk);border-radius:20px;font:400 18px/1 var(--display);pointer-events:none}
    #coins svg{width:27px;height:27px}#coins.bump{animation:bump .22s var(--ease)}
    .rail{position:absolute;right:12px;top:calc(var(--top) + 50px);z-index:2;display:grid;gap:9px}
    .rail button{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 #0006;transition:transform .08s,box-shadow .08s}
    .rail button:active{transform:translateY(4px);box-shadow:0 0 0 #0006}
    .rail svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .rail button[aria-pressed=true]{background:var(--yolk);color:var(--ink)}.rail button:disabled{display:none}
    #mute-button[aria-pressed=true]{background:var(--ink);color:#fff6e066}#mute-button .off{display:none}#mute-button[aria-pressed=true] .off{display:block}#mute-button[aria-pressed=true] .on{display:none}

    #combo{position:absolute;left:14px;top:calc(var(--top) + 76px);z-index:2;pointer-events:none;transform:rotate(-7deg);transform-origin:left top;display:grid;justify-items:start}
    #combo b{font:400 46px/.95 var(--display);color:var(--yolk);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
    #combo span{font:400 12px/1 var(--display);color:var(--paper);background:var(--ink);padding:5px 8px;border-radius:6px;margin-top:2px}
    #combo.pop b{animation:pop .2s var(--ease)}#combo.hot b{color:var(--blood)}

    #ko{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
    #ko b{font:400 clamp(40px,13.5vw,88px)/.9 var(--display);color:var(--blood);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-align:center;white-space:nowrap;animation:slam .9s var(--ease) both}
    #ko small{display:block;font:400 20px/1 var(--display);color:var(--yolk);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;margin-top:10px}

    #connection{position:absolute;z-index:3;left:50%;bottom:calc(var(--bottom) + 128px);transform:translateX(-50%);padding:8px 14px;background:var(--ink);color:var(--paper);font-size:12px;max-width:88%;text-align:center;border-radius:20px}
    #hint{position:absolute;z-index:1;left:50%;top:calc(var(--top) + 78px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 140px);text-align:center;pointer-events:none;font-size:12.5px;font-weight:700;line-height:1.25;color:var(--paper);background:var(--ink);padding:8px 13px;border-radius:14px;transition:opacity .4s,transform .4s var(--ease)}
    #hint.gone{opacity:0;transform:translateX(-50%) translateY(-8px)}

    /* Арсенал: карточки-наклейки, выбранная выпрыгивает */
    #shelf{position:absolute;inset:auto 0 0;z-index:2;padding:18px 0 var(--bottom)}
    #shop-hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    #weapons{display:flex;gap:8px;overflow-x:auto;padding:14px 12px 6px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 12px}
    #weapons::-webkit-scrollbar{display:none}
    .weapon{flex:0 0 78px;height:92px;display:grid;grid-template-rows:1fr auto auto;justify-items:center;align-items:center;gap:1px;padding:6px 3px 7px;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--ink);scroll-snap-align:start;transition:transform .16s var(--ease),background-color .12s}
    .weapon:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
    .weapon .icon{font-size:32px;line-height:1}.weapon .label{font-size:11.5px;font-weight:800;line-height:1.1}
    .weapon .price{font:400 11px/1 var(--display);display:flex;align-items:center;gap:3px;white-space:nowrap;min-height:14px}
    .weapon.owned .price{display:none}.weapon.owned{grid-template-rows:1fr auto}
    .weapon.selected{background:var(--yolk);transform:translateY(-10px)}
    .weapon.locked{background:var(--ink);color:var(--paper)}.weapon.locked .price{color:var(--yolk)}.weapon.locked .icon{filter:grayscale(.2)}
    .weapon.unaffordable .icon{filter:grayscale(1) brightness(.75)}.weapon.unaffordable .label{color:#fff6e099}.weapon.unaffordable .price{color:#fff6e099}
    .weapon.confirm{background:var(--blood);color:var(--paper);animation:throb .5s infinite alternate}.weapon.confirm .price{color:var(--paper)}
    .weapon.just{animation:unlock .5s var(--ease)}
    .price i{width:11px;height:11px;border-radius:50%;background:currentColor;display:inline-block}

    /* Шторка снизу */
    dialog{border:0;border-top:3px solid var(--ink);margin:auto 0 0;width:100%;max-width:none;max-height:86dvh;padding:18px 16px var(--bottom);background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;overscroll-behavior:contain;overflow-y:auto}
    dialog[open]{animation:sheet .34s var(--ease)}dialog::backdrop{background:#21140fb8}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .panel-head h2{font:400 26px/1 var(--display)}
    .close{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
    .close svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;stroke-linecap:round}
    .friends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:26px}
    .friend{position:relative;display:grid;justify-items:center;padding:0 8px 12px;border:3px solid var(--ink);border-radius:var(--r);background:var(--c);box-shadow:0 5px 0 var(--ink);margin-bottom:22px;transition:transform .1s}
    .friend:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
    .friend img{width:96px;height:96px;object-fit:contain;object-position:bottom;margin-top:-30px}
    .friend strong{font:400 17px/1 var(--display);color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;margin-top:6px}
    .friend small{font:400 11px/1 var(--display);background:var(--ink);color:var(--paper);padding:5px 8px;border-radius:6px;margin-top:8px}
    .friend[aria-pressed=true]{outline:4px solid var(--yolk);outline-offset:2px}
    .ranking h3{font:400 15px/1 var(--display);margin:22px 0 10px}.ranking h3:first-child{margin-top:0}
    .champ{display:flex;align-items:flex-end;gap:12px;background:var(--blood);color:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:0 14px 12px;margin:26px 0 12px}
    .champ img{width:92px;margin-top:-26px;flex:none}.champ div{display:grid;gap:4px;padding-bottom:4px}
    .champ b{font:400 22px/1 var(--display)}.champ .num{font-size:30px;line-height:1;color:var(--yolk);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}.champ small{font-size:12px}
    .ranking ol{list-style:none;display:grid;gap:6px}
    .ranking li{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;font-size:15px;font-weight:700;border-radius:10px}
    .ranking li img{width:34px;height:34px;object-fit:contain;object-position:bottom}
    .rank-number{width:26px;text-align:center;font:400 15px/1 var(--display)}.rank-name{flex:1;overflow-wrap:anywhere}
    .rank-hits{font:400 15px/1 var(--display)}
    .ranking li.me{background:var(--yolk);outline:3px solid var(--ink)}
    .notice{font-size:14px;line-height:1.5}
    .retry{background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:var(--r);margin-top:16px;min-height:46px;font:400 14px/1 var(--display)}

    #loading{position:absolute;inset:0;background:var(--yolk);z-index:10;display:grid;place-items:center;padding:30px;text-align:center}
    #loading h2{font:400 clamp(44px,15vw,72px)/.92 var(--display);transform:rotate(-5deg);margin-bottom:34px}
    #loading h2 em{font-style:normal;color:var(--paper);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill}
    #loading p{font-size:14px;font-weight:700;margin-top:14px}
    progress{appearance:none;-webkit-appearance:none;width:min(260px,70vw);height:22px;border:3px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden}
    progress::-webkit-progress-bar{background:var(--paper)}progress::-webkit-progress-value{background:var(--ink)}progress::-moz-progress-bar{background:var(--ink)}
    #announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

    @keyframes bump{50%{transform:scale(1.14)}}
    @keyframes pop{from{transform:scale(1.5)}}
    @keyframes rattle{20%{transform:translate(-3px,2px) rotate(-8deg)}50%{transform:translate(3px,-1px) rotate(7deg)}80%{transform:translate(-2px,1px) rotate(-3deg)}}
    @keyframes slam{0%{transform:scale(4) rotate(-14deg);opacity:0}22%{transform:scale(.92) rotate(-6deg);opacity:1}32%{transform:scale(1.04) rotate(-6deg)}40%,82%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(1.15) rotate(-6deg);opacity:0}}
    @keyframes throb{to{transform:translateY(-6px) scale(1.04)}}
    @keyframes unlock{0%{transform:scale(.8) rotate(-8deg)}50%{transform:scale(1.15) rotate(5deg) translateY(-14px)}}
    @keyframes sheet{from{transform:translateY(100%)}}
    @media(max-height:640px){.weapon{height:80px;flex-basis:70px}.weapon .icon{font-size:26px}#hint{display:none}#combo b{font-size:36px}}
    @media(min-width:560px){#weapons{justify-content:center}dialog{width:min(520px,100%);margin:auto auto 0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
  <script defer src="./vendor/telegram-web-app.js"></script>
  <script type="module">try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch{}</script>
  <script defer src="./vendor/matter.min.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
<main id="game">
  <canvas id="scene" aria-label="Комната. Коснись друга, чтобы ударить; зажми и тяни, чтобы швырнуть."></canvas>
  <header id="hud">
    <div id="portrait"><img id="portrait-img" alt=""></div>
    <div class="plate">
      <h1 id="friend-name">Пешка</h1>
      <div id="health" role="progressbar" aria-label="Здоровье друга" aria-valuemin="0" aria-valuemax="200" aria-valuenow="200"><div id="hp-ghost"></div><div id="hp-fill"></div><span id="hp-label">200</span></div>
    </div>
  </header>
  <div id="coins" aria-label="Монеты"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#ffcf1f" stroke="#fff6e0" stroke-width="2.5"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#21140f" stroke-width="2.5"/></svg><span class="num">0</span></div>
  <nav class="rail" aria-label="Управление">
    <button id="friends-button" aria-label="Выбрать друга"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.900 1.900 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17.5 14.200c2.300.2 3.700 1.700 4.100 4.300"/></svg></button>
    <button id="outfit-button" aria-label="Переключить костюм" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8.5 3.5 3 7l2.5 4 2-1v10.5h9V10l2 1L21 7l-5.5-3.5c-.5 1.600-1.800 2.5-3.5 2.5s-3-.9-3.5-2.5Z"/></svg></button>
    <button id="top-button" aria-label="Открыть рейтинг"><svg viewBox="0 0 24 24"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0V4Z"/><path d="M7.5 6H4.5c0 3 1.200 4.5 3.400 4.800M16.5 6h3c0 3-1.200 4.5-3.400 4.800M12 14v3.5M8.5 20.5h7M10 17.5h4"/></svg></button>
    <button id="mute-button" aria-label="Выключить звук" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4Z"/><path class="on" d="M15.5 9a4.200 4.200 0 0 1 0 6M18 6.5a7.800 7.800 0 0 1 0 11"/><path class="off" d="m16 9.5 5 5m0-5-5 5"/></svg></button>
  </nav>
  <div id="combo" hidden><b></b><span></span></div>
  <div id="ko" hidden><b>НОКАУТ!<small></small></b></div>
  <div id="connection" role="status" hidden>Нет связи, прогресс сохранён</div>
  <p id="hint">Ткни, чтобы стукнуть. Зажми и тяни, чтобы швырнуть.</p>
  <footer id="shelf"><span id="shop-hint"></span><div id="weapons" role="group" aria-label="Оружие"></div></footer>
  <dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title">Друзья</h2><button class="close" id="close-panel" aria-label="Закрыть"><svg viewBox="0 0 20 20"><path d="m4 4 12 12M16 4 4 16"/></svg></button></div><div id="panel-content"></div></dialog>
  <section id="loading" role="status"><div><h2>БЕЙ<br><em>ДРУГА</em></h2><progress id="load-progress" max="100" value="0"></progress><p id="load-text">Собираем друга по частям</p><button id="reload" class="retry" hidden>Ещё раз</button></div></section>
  <div id="announcement" aria-live="polite"></div>
</main>
</body>
</html>
