<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8e2d6">
  <title>Beat the Buddy</title>
  <style>
    :root{color-scheme:light;--room:#e8e2d6;--paper:#faf7ef;--ink:#332f29;--muted:#686154;--gold:#efbf46;--line:#d7d0c2;--danger:#a53c2e;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--room)}
    *{box-sizing:border-box}body{margin:0;overflow:hidden;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}button:hover{filter:brightness(.95)}button:disabled{cursor:default}::selection{background:var(--gold);color:var(--ink)}[hidden]{display:none!important}h1,h2,p{margin:0}button,a{user-select:none}#game{position:relative;width:100%;height:100dvh;min-height:360px;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}header{position:absolute;inset:0 0 auto;background:var(--paper);padding:calc(env(safe-area-inset-top) + 12px) max(16px,calc((100% - 520px)/2)) 10px;z-index:2}.headline{display:flex;justify-content:space-between;align-items:center;gap:16px}.name{display:flex;align-items:baseline;gap:9px;min-width:0}.name h1{font-size:24px;font-weight:800;letter-spacing:-.025em}.name small{font-size:11px;color:var(--muted)}#coins{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.health{display:flex;gap:10px;align-items:center;margin-top:7px}.track{height:7px;background:#ded7ca;flex:1;border-radius:6px;overflow:hidden}#hp-fill{height:100%;background:#71845a;transform-origin:left;transition:transform .12s}#hp-label{min-width:68px;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}.controls button{min-width:44px;min-height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px}.controls small{font-size:12px;font-weight:600}.controls button[aria-pressed=true]{background:#e4ddce}.controls button:disabled{opacity:.35}#connection{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 147px);left:50%;transform:translateX(-50%);padding:7px 12px;background:var(--paper);font-size:12px;max-width:90%;text-align:center;border-radius:8px}#combo{position:absolute;top:calc(env(safe-area-inset-top) + 165px);right:max(20px,calc((100% - 490px)/2));font-size:25px;font-weight:900;color:#865117;pointer-events:none}#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 153px);left:16px;right:16px;text-align:center;pointer-events:none;font-size:12px;color:var(--muted)}footer{position:absolute;inset:auto 0 0;background:var(--paper);padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);z-index:2}.shelf-label{display:flex;justify-content:space-between;gap:12px;max-width:520px;margin:0 auto 8px;padding:0 16px;font-size:12px;color:var(--muted)}.shelf-label strong{color:var(--ink);font-size:13px}#weapons{display:flex;gap:6px;overflow-x:auto;padding:0 max(12px,calc((100% - 520px)/2));scrollbar-width:thin;scrollbar-color:#bdb4a1 var(--paper);scroll-snap-type:x proximity}.weapon{flex:0 0 86px;min-height:94px;padding:5px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#eee8db;border-radius:10px;scroll-snap-align:center}.weapon .icon{font-size:30px;line-height:35px}.weapon .label{font-size:12px;font-weight:700}.weapon .price{font-size:11px;color:#655c4d;white-space:nowrap}.weapon.selected,.weapon.confirm{background:var(--gold)}.weapon.unaffordable{opacity:.48}.weapon.selected .price{color:#4c3d19}dialog{border:0;background:var(--paper);color:var(--ink);width:min(480px,calc(100% - 24px));max-height:calc(100dvh - 40px);padding:20px;border-radius:16px;box-shadow:0 16px 48px #302a2433;overscroll-behavior:contain}dialog::backdrop{background:#332f2966}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}.panel-head h2{font-size:24px;letter-spacing:-.025em}.close{width:44px;height:44px;background:#e8e1d2;border-radius:50%;font-size:24px}.friends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.friend{display:flex;flex-direction:column;align-items:center;background:#eae4d8;border-radius:12px;padding:8px;gap:4px;min-height:142px}.friend[aria-pressed=true]{background:#efd080}.friend img{width:90px;height:91px;object-fit:contain}.friend strong{font-size:15px}.friend small{font-size:12px;color:var(--muted)}.ranking h3{font-size:16px;margin:20px 0 8px}.ranking ol{list-style:none;margin:0;padding:0}.ranking li{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid var(--line);font-size:14px}.rank-number{width:24px;color:var(--muted)}.rank-name{flex:1;overflow-wrap:anywhere}.rank-hits{font-weight:700;font-variant-numeric:tabular-nums}.ranking li.me{background:#f3dda7;border-radius:6px;padding:0 8px}.notice{font-size:14px;line-height:1.5;color:var(--muted)}.retry{background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:8px;margin-top:16px;min-height:44px}#loading{position:absolute;inset:0;background:var(--room);z-index:10;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}#loading h2{font-size:32px;letter-spacing:-.03em;max-width:280px;margin:0 auto 20px}#loading p{font-size:14px;color:var(--muted)}progress{width:240px;height:8px;margin:20px 0;accent-color:var(--gold)}#announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(max-width:350px){.controls small{display:none}.name small{display:none}.name h1,#coins{font-size:21px}.weapon{flex-basis:80px}dialog{padding:14px}.friend{min-height:125px}.friend img{height:75px}}
    @media(max-height:600px){header{padding-top:calc(env(safe-area-inset-top) + 5px)}.controls{margin-top:0}.controls button{min-height:38px}footer{padding-top:7px}.weapon{min-height:78px}.weapon .icon{font-size:25px;line-height:29px}#hint{display:none}.friend{min-height:100px}.friend img{height:55px}#combo{top:145px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
  <script src="./vendor/telegram-web-app.js"></script>
  <script src="./vendor/matter.min.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
<main id="game">
  <canvas id="scene" aria-label="Игровая комната. Коснись друга, чтобы ударить; удерживай и тяни, чтобы бросить."></canvas>
  <header id="hud">
    <div class="headline"><div class="name"><h1 id="friend-name">Пешка</h1><small>Beat the Buddy</small></div><div id="coins" aria-label="Монеты">🪙 <span>0</span></div></div>
    <div class="health"><div class="track" role="progressbar" aria-label="Здоровье друга" aria-valuemin="0" aria-valuemax="200" aria-valuenow="200" id="health"><div id="hp-fill"></div></div><span id="hp-label">200 / 200</span></div>
    <nav class="controls" aria-label="Управление"><button id="friends-button" aria-label="Выбрать друга">👥 <small>Друзья</small></button><button id="outfit-button" aria-label="Переключить костюм" aria-pressed="false">👕 <small>Костюм</small></button><button id="top-button" aria-label="Открыть рейтинг">🏆 <small>Топ</small></button><button id="mute-button" aria-label="Выключить звук" aria-pressed="false">🔊</button></nav>
  </header>
  <div id="connection" role="status" hidden>Нет связи · прогресс сохранён</div>
  <div id="combo" hidden></div>
  <p id="hint">Коснись — тычок. Потяни — бросок.</p>
  <footer id="shelf"><div class="shelf-label"><strong>Арсенал</strong><span id="shop-hint">Листай, чтобы выбрать оружие →</span></div><div id="weapons" role="group" aria-label="Оружие"></div></footer>
  <dialog id="panel" aria-labelledby="panel-title"><div class="panel-head"><h2 id="panel-title">Друзья</h2><button class="close" id="close-panel" aria-label="Закрыть">×</button></div><div id="panel-content"></div></dialog>
  <section id="loading" role="status"><div><h2>Собираем друга по частям.</h2><p id="load-text">Загружаем комнату и арсенал</p><progress id="load-progress" max="100" value="0"></progress><br><button id="reload" class="retry" hidden>Попробовать снова</button></div></section>
  <div id="announcement" aria-live="polite"></div>
</main>
</body>
</html>
