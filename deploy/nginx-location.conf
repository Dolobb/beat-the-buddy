# Вставить внутрь существующего HTTPS server {} (и добавить туда же `http2 on;`).
# Статику отдаёт сам nginx: сжатие, ETag и 304 вместо полной перекачки при каждом открытии.
# ^~ обязателен: иначе regex-правила сайта для .js/.png перехватят файлы игры.
location = /buddy {
    return 308 /buddy/;
}
location ^~ /buddy/api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
location = /buddy/assets/manifest.json {
    alias /opt/buddy/app/assets/manifest.json;
    add_header Cache-Control "no-cache";
}
location ^~ /buddy/assets/ {
    alias /opt/buddy/app/assets/;
    add_header Cache-Control "public, max-age=86400";
}
location ^~ /buddy/vendor/ {
    alias /opt/buddy/app/vendor/;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/javascript;
    add_header Cache-Control "public, max-age=2592000";
}
location ^~ /buddy/ {
    alias /opt/buddy/app/;
    index index.html;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json;
    add_header Cache-Control "no-cache";
}
